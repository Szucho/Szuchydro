name: tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: pip install numpy

        #Kokkos will take most of build time so we keep the build directory between runs
        #key changes when CMake files change which will force a clean build
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'mesh/CMakeLists.txt') }}

        #SZ_NATIVE=OFF: CI machines vary so portable build
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DSZ_NATIVE=OFF

      - name: build
        run: cmake --build build -j "$(nproc)"

      - name: Run tests
        run: python3 tests/run_tests.py --exe build/szuchydro
